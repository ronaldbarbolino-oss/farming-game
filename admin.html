<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Farming Admin</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#3f8a26;--card:#fff6df;--ink:#3a2615;--wood:#8f5a2a;--btn:#3f8f2c;--err:#c8382b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f3a16;--card:#2b2118;--ink:#f6ead2;--wood:#c98a4b;--btn:#4fa83a;--err:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f3a16;--card:#2b2118;--ink:#f6ead2;--wood:#c98a4b;--btn:#4fa83a;--err:#ff8a7a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font:600 16px/1.45 system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:24px 16px}
main{width:min(520px,100%)}h1{color:#fff;font-size:1.6rem;margin:0 0 14px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.card{background:var(--card);border:4px solid var(--wood);border-radius:16px;padding:16px;box-shadow:0 6px 0 var(--wood);margin-bottom:18px}
label{display:block;font-weight:800;margin:10px 0 4px}input,textarea{width:100%;font:inherit;padding:10px 12px;border:3px solid var(--wood);border-radius:10px;background:transparent;color:var(--ink)}
textarea{font:600 .82rem/1.35 ui-monospace,monospace;word-break:break-all;min-height:110px}
button{font:inherit;font-weight:900;border:0;border-radius:10px;background:var(--btn);color:#fff;padding:11px 16px;margin-top:12px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
button.alt{background:var(--wood)}button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #2f7fb8;outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.err{color:var(--err);min-height:1.2em;margin:8px 0 0}.note{font-size:.9rem;opacity:.85;margin:6px 0 0}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.quick button{margin:0;padding:6px 10px;font-size:.85rem;background:transparent;color:var(--ink);border:2px solid var(--wood);box-shadow:none}
ul{padding-left:18px;margin:6px 0 0}li{margin:4px 0;word-break:break-all;font-size:.85rem}
</style></head><body><main>
<h1>Farming · Admin</h1>
<section class="card" id="lock">
  <form id="unlockF"><label for="pw">Admin password</label><input id="pw" type="password" autocomplete="current-password" required>
  <button type="submit" id="unlockB">Unlock</button><p class="err" id="lockErr" role="alert"></p></form>
</section>
<section class="card" id="gift" hidden>
  <form id="giftF">
    <label for="who">Player username or farm name</label><input id="who" required maxlength="40" placeholder="e.g. rayle or Rayle's Farm">
    <label for="amt">Coins to give</label><input id="amt" type="number" min="1" max="1000000" step="1" value="5000" required>
    <div class="quick"><button type="button" data-a="500">500</button><button type="button" data-a="1000">1,000</button><button type="button" data-a="5000">5,000</button><button type="button" data-a="10000">10,000</button></div>
    <button type="submit" id="makeB">Make Gift Code</button><p class="err" id="giftErr" role="alert"></p>
  </form>
  <div id="out" hidden>
    <label for="code">Gift code</label><textarea id="code" readonly></textarea>
    <div class="row"><button type="button" id="copyB">Copy code</button><button type="button" class="alt" id="shareB">Share</button></div>
    <p class="note">Send this to the player. In the game they tap <b>🎁 Redeem Code</b> and paste it. It works once, only for that player.</p>
  </div>
  <label>Made this session</label><ul id="hist"><li>None yet.</li></ul>
  <button type="button" class="alt" id="lockB">Lock</button>
</section>
</main>
<script>
const ENC={"salt": "H2dVWCh4wBcPwaoacs1fFg==", "iv": "yD20rV2Bitmu0Lqf", "ct": "WmXE/ZJHn7Y0PwQUOoK/OF3SeEuSGkdrrllKir3mpvY6eHTmRM3RMxTqsXCp/n2nuM5PDQMQ0Xn1GVdmv1478Fp9VKV9T5lrHPUc+nYKh4GQRKJqRPvAQiKp6BNQaUu6GYdEZbe7TjBmAtmNSshYCtxYTOEzzoWlfaDRZMzmZnPCgLZpVDxf/61aezDrBITYvrUZTYOMyEeuVsCxAThNBFPtDBuUKMzARpmpp8XqsD2Vulc6DyLaKHYkYmm8NiVMVwA2iLeFYwhJusdhDJyosYgzep8sRFKdKfwpP9mi", "it": 310000};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64u=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
let SK=null;const $=id=>document.getElementById(id);
$("unlockF").onsubmit=async e=>{e.preventDefault();$("lockErr").textContent="";$("unlockB").disabled=true;
  try{const base=await crypto.subtle.importKey("raw",new TextEncoder().encode($("pw").value.trim()),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const jwk=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.ct))));
    SK=await crypto.subtle.importKey("jwk",jwk,{name:"ECDSA",namedCurve:"P-256"},false,["sign"]);$("pw").value="";$("lock").hidden=true;$("gift").hidden=false;$("who").focus()}
  catch(err){$("lockErr").textContent=window.crypto&&crypto.subtle?"Wrong password.":"Open this page over https."}$("unlockB").disabled=false};
document.querySelectorAll(".quick button").forEach(b=>b.onclick=()=>{$("amt").value=b.dataset.a});
const hist=[];
$("giftF").onsubmit=async e=>{e.preventDefault();$("giftErr").textContent="";const u=$("who").value.trim(),c=Math.floor(+$("amt").value);
  if(!u)return $("giftErr").textContent="Type the player's username or farm name.";if(!(c>0&&c<=1000000))return $("giftErr").textContent="Coins must be between 1 and 1,000,000.";
  const n=[...crypto.getRandomValues(new Uint8Array(6))].map(b=>b.toString(16).padStart(2,"0")).join("");
  const p=new TextEncoder().encode(JSON.stringify({u,c,n,t:Math.floor(Date.now()/1000)}));
  const sig=new Uint8Array(await crypto.subtle.sign({name:"ECDSA",hash:"SHA-256"},SK,p));const code="FARM-"+b64u(p)+"."+b64u(sig);
  $("code").value=code;$("out").hidden=false;hist.unshift(c.toLocaleString()+" coins → "+u);$("hist").innerHTML="";hist.forEach(t=>{const li=document.createElement("li");li.textContent=t;$("hist").append(li)})};
$("copyB").onclick=async()=>{try{await navigator.clipboard.writeText($("code").value);$("copyB").textContent="Copied!"}catch(e){$("code").select();document.execCommand("copy");$("copyB").textContent="Copied!"}setTimeout(()=>$("copyB").textContent="Copy code",1600)};
$("shareB").onclick=async()=>{const t="Your Farming gift code (open the game, tap 🎁 Redeem Code):\n"+$("code").value;if(navigator.share){try{await navigator.share({text:t})}catch(e){}}else{try{await navigator.clipboard.writeText(t)}catch(e){}$("shareB").textContent="Copied!";setTimeout(()=>$("shareB").textContent="Share",1600)}};
$("lockB").onclick=()=>{SK=null;$("gift").hidden=true;$("out").hidden=true;$("lock").hidden=false;$("pw").focus()};
</script></body></html>
